<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>신진우 · 유소정 혼배미사</title>
<style>
/* 폰트 */
@font-face{font-family:"Bookk Myungjo";font-weight:300;src:url("assets/font/BookkMyungjo_Light.woff2") format("woff2");font-display:swap;}
@font-face{font-family:"Bookk Myungjo";font-weight:700;src:url("assets/font/BookkMyungjo_Bold.woff2") format("woff2");font-display:swap;}

/* === 설정값: 여기 숫자만 바꾸면 크기/색/간격 조정 === */
:root{
  --gold:#b08d57;
  --ink:#6b5a45;
  --ink-title:#4a4038;
  --bg:#FBF9F5;

  --arch-w:min(92vw, 460px);                  /* 아치(본문) 가로폭 */
  --arch-top-h:calc(var(--arch-w) * 0.5145);  /* 아치 곡선 높이(이미지 비율) */
  --arch-bot-h:calc(var(--arch-w) * 0.2218);  /* 아치 하단(기둥끝+마름모) 높이 */

  --header-h:clamp(132px, 30vw, 168px);  /* 상단 고정 높이 */
  --band-h:clamp(72px, 18vw, 96px);      /* 하단 띠+인사문+양끝장식 고정 높이 */
}

*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:"Bookk Myungjo", serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-text-size-adjust:100%;
  overflow:hidden;          /* 바깥 스크롤 잠금 */
}

/* 화면 = 헤더(고정) + 가운데 + 띠(고정) */
.stage{
  position:relative;
  width:100%;
  height:100vh;
  height:100dvh;
  max-height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* === 1. 상단 헤더 (고정) === */
.header{
  flex:0 0 var(--header-h);
  position:relative;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding-top:clamp(14px,4vw,22px);
  background:var(--bg);
  z-index:5;
}
.header-inner{position:relative;width:var(--arch-w);display:flex;flex-direction:column;align-items:center;}
.toprow{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2.5vw,16px);}
.toprow .date,.toprow .place{color:#cfc6b8;font-weight:700;font-size:clamp(15px,4.6vw,22px);letter-spacing:.5px;white-space:nowrap;}
.toprow .cross{height:clamp(34px,9vw,46px);}
.bird,.light{position:absolute;}
.bird{top:clamp(4px,1.5vw,10px);height:clamp(46px,13vw,64px);z-index:2;}
.bird.left{left:-2px;}
.bird.right{right:-2px;}
.light{top:clamp(0px,0.5vw,6px);height:clamp(54px,15vw,74px);opacity:.5;z-index:1;}
.light.left{left:-12px;}
.light.right{right:-12px;}
.namerow{margin-top:clamp(8px,2.5vw,14px);display:flex;align-items:center;justify-content:center;gap:clamp(6px,2vw,12px);}
.namecol{display:flex;flex-direction:column;align-items:center;}
.name{color:var(--ink-title);font-weight:700;font-size:clamp(20px,6.2vw,30px);letter-spacing:1px;line-height:1.1;}
.baptism{color:var(--ink);font-weight:300;font-size:clamp(11px,3.2vw,15px);margin-top:3px;}
.namerow .shape{height:clamp(13px,3.4vw,18px);}
.namerow .dotline{width:clamp(10px,3vw,18px);height:1px;background:#cdb188;}

/* === 2. 가운데: 아치 배경(고정) + 본문(스크롤) 두 층 겹침 === */
.middle{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;}
/* 곡선 구간 페이드: 글자가 곡선 영역에 닿으면 배경색에 가려 사라짐 */
.fade-curve{
  position:absolute;
  top:0;left:0;right:0;
  height:calc(var(--arch-top-h) * 0.92);
  z-index:3;
  pointer-events:none;
  background:linear-gradient(
    to bottom,
    var(--bg) 0%,
    var(--bg) 42%,
    rgba(251,249,245,0) 100%
  );
}

/* (2-a) 아치 배경 — 고정, 절대 안 움직임 */
.arch-bg{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:var(--arch-w);pointer-events:none;z-index:4;}
.arch-bg .a-top{position:absolute;top:0;left:0;width:100%;height:var(--arch-top-h);display:block;}
.arch-bg .a-mid{position:absolute;left:0;width:100%;top:calc(var(--arch-top-h) - 2px);bottom:calc(var(--arch-bot-h) - 2px);background-image:url("assets/img/arch-middle.png");background-repeat:repeat-y;background-position:center top;background-size:100% auto;}
.arch-bg .a-bot{position:absolute;bottom:0;left:0;width:100%;height:var(--arch-bot-h);display:block;}


/* (2-b) 본문 — 스크롤 */
.scrollarea{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;z-index:2;}
.scrollarea::-webkit-scrollbar{display:none;}
.content{
  width:var(--arch-w);
  margin:0 auto;
  text-align:center;
  padding-top:calc(var(--arch-top-h) * 0.60);                    /* 곡선 안쪽으로 */
  padding-bottom:calc(var(--arch-bot-h) + clamp(16px,4vw,28px)); /* 하단장식 위로 안 올라오게 */
  padding-left:4%;
  padding-right:4%;
}

.section{margin-bottom:clamp(30px,8vw,46px);}
.section:last-child{margin-bottom:0;}
.sec-title{font-weight:700;color:var(--ink-title);font-size:clamp(21px,6.4vw,30px);letter-spacing:2px;}
.sec-divider{display:block;margin:clamp(8px,2.4vw,14px) auto clamp(12px,3.4vw,18px);width:clamp(150px,62%,300px);height:auto;}
.item{font-weight:700;color:var(--ink-title);font-size:clamp(16px,4.8vw,20px);line-height:1.9;letter-spacing:.5px;}
/* 통상문 본문 — 여기 안에 글을 채워 넣으세요 */
.text-slot{font-weight:300;color:var(--ink);font-size:clamp(13.5px,4.1vw,16px);line-height:1.95;text-align:left;margin:clamp(6px,2vw,10px) auto clamp(16px,4.5vw,22px);max-width:94%;white-space:pre-wrap;}
.text-slot:empty::before{content:"［ 여기에 통상문을 붙여넣으세요 ］";color:#c9bfae;display:block;text-align:center;font-size:.85em;padding:6px 0;}
.resp{color:var(--gold);font-weight:700;}

/* === 3. 하단 띠 + 인사문 (고정) === */
.footer{flex:0 0 var(--band-h);position:relative;background:var(--bg);z-index:5;display:flex;flex-direction:column;justify-content:flex-end;}
.footer .band-img{display:block;width:100%;height:auto;}
/* 인사문 + 양 끝 장식 (왼쪽 cross2, 오른쪽 cup) */
.footer .msg-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:clamp(6px,2vw,12px);
  padding:4px clamp(8px,3vw,18px) 6px;
}
.footer .foot-deco{
  flex:0 0 auto;
  height:clamp(40px,11vw,58px);
  width:auto;
}
.footer .msg{flex:1 1 auto;text-align:center;color:#a99a82;font-weight:300;font-size:clamp(10.5px,3vw,13px);line-height:1.5;}
</style>
</head>
<body>
<div class="stage">

  <!-- ===== 1. 상단 헤더 (고정) ===== -->
  <header class="header">
    <div class="header-inner">
      <img class="light left"  src="assets/img/light.png" alt="">
      <img class="light right" src="assets/img/light.png" alt="">
      <img class="bird left"  src="assets/img/leftbird.png"  alt="">
      <img class="bird right" src="assets/img/rightbird.png" alt="">
      <div class="toprow">
        <span class="date">2026. 06. 20</span>
        <img class="cross" src="assets/img/cross.png" alt="">
        <span class="place">분당성요한성당</span>
      </div>
      <div class="namerow">
        <div class="namecol"><span class="name">신진우</span><span class="baptism">바르톨로메오</span></div>
        <span class="dotline"></span>
        <img class="shape" src="assets/img/Shape.png" alt="">
        <span class="dotline"></span>
        <div class="namecol"><span class="name">유소정</span><span class="baptism">루스티카</span></div>
      </div>
    </div>
  </header>

  <!-- ===== 2. 가운데 (아치 고정 + 본문 스크롤) ===== -->
  <div class="middle">

    <!-- (2-a) 아치 배경 — 고정 -->
    <div class="arch-bg">
      <img class="a-top" src="assets/img/arch-top.png" alt="">
      <div class="a-mid"></div>
      <img class="a-bot" src="assets/img/arch-bottom.png" alt="">
    </div>

    <!-- (2-b) 본문 — 스크롤 -->
    <div class="scrollarea">
      <div class="content">

        <!-- ▼▼▼ 여기부터 본문. 각 text-slot 안에 통상문을 넣으세요 ▼▼▼ -->

        <section class="section">
          <h2 class="sec-title">시작예식</h2>
          <img class="sec-divider" src="assets/img/line.png" alt="">
          <div class="item">입장 및 입당성가</div>
          <div class="text-slot"></div>
          <div class="item">참회예식</div>
          <div class="text-slot"></div>
          <div class="item">자비송</div>
          <div class="text-slot"></div>
          <div class="item">대영광송</div>
          <div class="text-slot"></div>
        </section>

        <section class="section">
          <h2 class="sec-title">말씀전례</h2>
          <img class="sec-divider" src="assets/img/line.png" alt="">
          <div class="item">제1독서</div>
          <div class="text-slot"></div>
          <div class="item">화답송</div>
          <div class="text-slot"></div>
          <div class="item">제2독서</div>
          <div class="text-slot"></div>
          <div class="item">복음환호송</div>
          <div class="text-slot"></div>
          <div class="item">강론</div>
          <div class="text-slot"></div>
        </section>

        <section class="section">
          <h2 class="sec-title">혼인예식</h2>
          <img class="sec-divider" src="assets/img/line.png" alt="">
          <div class="item">질문과 답</div>
          <div class="text-slot"></div>
          <div class="item">합의 및 수용</div>
          <div class="text-slot"></div>
          <div class="item">반지축복·교환</div>
          <div class="text-slot"></div>
          <div class="item">보편지향기도</div>
          <div class="text-slot"></div>
        </section>

        <section class="section">
          <h2 class="sec-title">성찬전례</h2>
          <img class="sec-divider" src="assets/img/line.png" alt="">
          <div class="item">봉헌성가</div>
          <div class="text-slot"></div>
          <div class="item">예물기도</div>
          <div class="text-slot"></div>
          <div class="item">혼인감사송</div>
          <div class="text-slot"></div>
          <div class="item">감사기도</div>
          <div class="text-slot"></div>
        </section>

        <section class="section">
          <h2 class="sec-title">영성체예식</h2>
          <img class="sec-divider" src="assets/img/line.png" alt="">
          <div class="item">주님의 기도</div>
          <div class="text-slot"></div>
          <div class="item">혼인축복</div>
          <div class="text-slot"></div>
          <div class="item">평화예식</div>
          <div class="text-slot"></div>
          <div class="item">영성체</div>
          <div class="text-slot"></div>
        </section>

        <section class="section">
          <h2 class="sec-title">마침예식</h2>
          <img class="sec-divider" src="assets/img/line.png" alt="">
          <div class="item">장엄강복</div>
          <div class="text-slot"></div>
          <div class="item">파견성가</div>
          <div class="text-slot"></div>
          <div class="item">퇴장</div>
          <div class="text-slot"></div>
        </section>

        <!-- ▲▲▲ 본문 끝 ▲▲▲ -->

      </div>
    </div>

    <!-- 곡선 구간 페이드 가림막 (글자가 곡선에 닿으면 사라지게) -->
    <div class="fade-curve"></div>

  </div>

  <!-- ===== 3. 하단 띠 + 인사문 (고정) ===== -->
  <footer class="footer">
    <img class="band-img" src="assets/img/bottom.png" alt="">
    <div class="msg-row">
      <img class="foot-deco left"  src="assets/img/cross2.png" alt="">
      <div class="msg">저희의 결혼을 축하하러 와 주셔서 감사드립니다.<br>사랑과 평화가 항상 여러분과 함께하기를 기도드립니다.</div>
      <img class="foot-deco right" src="assets/img/cup.png" alt="">
    </div>
  </footer>

</div>
</body>
</html>
